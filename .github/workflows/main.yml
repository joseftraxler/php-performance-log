      - name: Install dependencies
        run: composer update --no-interaction --prefer-lowest --with simple-as-fuck/php-validator:^0.7.0 --with guzzlehttp/promises:^2.0

      - name: Run static analysis
        run: vendor/bin/phpstan analyse

      - name: Run tests
        run: vendor/bin/phpunit test/ --bootstrap vendor/autoload.php

