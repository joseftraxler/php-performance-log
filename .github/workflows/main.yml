name: CI

on:
  push:
    branches:
      - "**"

jobs:
  php85:
    name: "php 8.5"
    runs-on: ubuntu-latest
    container: "nofutur3/php-tests:8.5"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: composer update --no-interaction --prefer-lowest --with simple-as-fuck/php-validator:^0.8.0 --with illuminate/contracts:^13.0 --with symfony/http-foundation:^8.0 --with psr/http-message:^2.0 --with psr/log:^3.0

      - name: Run static analysis
        run: vendor/bin/phpstan analyse

      - name: Run tests
        run: vendor/bin/phpunit test/ --bootstrap vendor/autoload.php

  php84:
    name: "php 8.4, guzzle promise 3"
    runs-on: ubuntu-latest
    container: "nofutur3/php-tests:8.4"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: phive install --trust-gpg-keys E82B2FB314E9906E

      - name: Chesk code style
        run: tools/php-cs-fixer fix --dry-run --no-interaction

      - name: Install dependencies
        run: composer update --no-interaction --prefer-lowest --with guzzlehttp/promises:^3.0

      - name: Run static analysis
        run: vendor/bin/phpstan analyse

      - name: Run tests
        run: vendor/bin/phpunit test/ --bootstrap vendor/autoload.php

  php84a:
    name: "php 8.4, validator 0.7, guzzle promise 2"
    runs-on: ubuntu-latest
    container: "nofutur3/php-tests:8.4"
    steps:
      - name: Checkout repository
